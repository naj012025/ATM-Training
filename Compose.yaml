services:
 postgres:
 image: postgres:18
 container_name: atm-postgres
 environment:
 POSTGRES_DB: atm_db
 POSTGRES_USER: atm_user
 POSTGRES_PASSWORD: dev_password_change_me
 ports:
 - "5432:5432"
 volumes:
 - atm_postgres_data:/var/lib/postgresql/data
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U atm_user -d atm_db"]
 interval: 5s
 timeout: 5s
 retries: 10
volumes:
 atm_postgres_data:
